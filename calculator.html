<!DOCTYPE html>
<html>
    <head>
        <title>Developer Calculator</title>
        <style>
            body {
                background-color: #0f172a;
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                padding-top: 50px;
            }
            .calc-box {
                background-color: #1e293b;
                padding: 20px;
                border-radius: 12px;
                box-shadow: 0px 4px 10px rgba(0,0,0,0,3);
            }
            #display {
                width: 100%;
                height: 50px;
                background-color: #334155;
                color: #38bdf8;
                font-size: 24px;
                text-align: right;
                padding: 5px;
                border: none;
                border-radius: 6px;
                margin-bottom: 15px;
                box-sizing: border-box;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            button {
                padding: 15px;
                font-size: 18px;
                background-color: #475569;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }
            button:hover {
                background-color: #64748b;
            }
            .operator {
                background-color: #ea580c;
            }
        </style>
    </head>
    <body>

        <div class="calc-box">
            <input type="text" id="display" readonly>
            <div class="grid">
                <button onclick="clearDisplay()">C</button>
                <button onclick="press('/')" class="operator">/</button>
                <button onclick="press('*')" class="operator">*</button>
                <button onclick="press('-')" class="operator">-</button>

                <button onclick="press('7')">7</button>
                <button onclick="press('8')">8</button>
                <button onclick="press('9')">9</button>
                <button onclick="press('+')" class="operator">+</button>

                <button onclick="press('4')">4</button>
                <button onclick="press('5')">5</button>
                <button onclick="press('6')">6</button>
                <button onclick="calculate()" style="grid-row: span 2; background-color: #10b981;">=</button>

                <button onclick="press('1')">1</button>
                <button onclick="press('2')">2</button>
                <button onclick="presss('3')">3</button>

                <button onclick="press('0')" style="grid-column: span 3;">0</button>
            </div>
        </div>

        <script>
            let display = document.getElementById('display');

            function press(num) {
                dispay.value += num;
            }

            function clearDisplay() {
                display.value = '';
            }

            function calculate() {
                try {
                    display.value = eval(display.value);
                } catch (err) {
                    display.value = 'Error'
                }
            }
        </script>
    </body>
</html>
